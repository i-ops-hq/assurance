[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-core"
version = "0.1.0"
description = "Pure decision modules for enterprise task assurance — arithmetic, not models."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
