[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing assurance checks over a folder."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "assurance-core>=0.1",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assurance-mcp = "assurance_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
