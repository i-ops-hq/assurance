[pytest]
# Four packages in one repo, and four test module basenames appear in more than one of them —
# test_version.py, test_read_only.py, test_readme_blocks.py, test_installed_wheel.py. Under
# pytest's default prepend import mode those collide on import and collection dies, because two
# modules cannot share a name without packages. importlib mode imports each by path instead.
#
# The alternative was renaming a dozen files to be globally unique, which would make every package's
# suite read worse to serve a constraint that belongs to the repo rather than to any of them.
addopts = --import-mode=importlib
