[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-core"
version = "0.13.0"
description = "Pure decision modules for enterprise task assurance — arithmetic, not models."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "I-Ops Operations Intelligence, LLC", email = "hello@i-ops.dev" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "governance", "auditing", "evaluation", "assurance", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://i-ops.dev"
Source = "https://github.com/i-ops-hq/assurance"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
