name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: The package must not reach a model or a service
        # The AST gates run above, but assert the property directly too: importing every
        # module must never pull in a service. A gate that only ever runs beside the code
        # it guards is worth less than one that also runs against an installed copy.
        run: |
          python -c "
          import importlib, sys
          for m in ('coverage','staleness','admission','policy','rule_of_two','run_budget',
                    'task_contract','verification','run_outcome','report_period','effects',
                    'worker','principal','semantic_checks','admission_config','policy_config'):
              importlib.import_module(f'assurance_core.{m}')
          leaked = [m for m in sys.modules if m.startswith(('app.','mlx','openai','anthropic'))]
          assert not leaked, leaked
          print('16 modules imported, nothing leaked')
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distributions
        # `twine check` is what catches a README that will render as raw text on PyPI.
        # That happened for real on 0.1.0 via relative links, so it runs on every push now.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
