[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-authority"
version = "0.1.0"
description = "Decide whether a task may proceed for the person who asked — without lending them somebody else's clearance."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "assurance-core>=0.13",
]
keywords = ["ai-agents", "authorization", "governance", "permissions", "assurance", "least-privilege"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0"]

[project.scripts]
assurance-authority = "assurance_authority.cli:main"

[project.urls]
Source = "https://github.com/i-ops-hq/assurance"

[tool.setuptools.packages.find]
include = ["assurance_authority*"]

[tool.setuptools.package-data]
assurance_authority = ["py.typed"]

[tool.mypy]
strict = true
