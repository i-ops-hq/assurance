[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-budget"
version = "0.1.3"
description = "Where an agent run's budget went, and where the loop went nowhere. Ceilings a caller cannot raise."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "assurance-core>=0.13.2",
]
keywords = ["ai-agents", "observability", "cost-control", "guardrails", "assurance", "llm-ops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0"]

[project.scripts]
assurance-budget = "assurance_budget.cli:main"

[project.urls]
Source = "https://github.com/i-ops-hq/assurance-budget"

[tool.setuptools.packages.find]
include = ["assurance_budget*"]

[tool.setuptools.package-data]
assurance_budget = ["py.typed"]

[tool.mypy]
strict = true
