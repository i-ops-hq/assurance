[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-budget"
version = "0.2.3"
description = "Where an agent run's budget went, and where the loop went nowhere. Ceilings a caller cannot raise."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "assurance-core>=0.14.0",
]
keywords = ["ai-agents", "observability", "cost-control", "guardrails", "assurance", "llm-ops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.0"]

[project.scripts]
assurance-budget = "assurance_budget.cli:main"

[project.urls]
Source = "https://github.com/i-ops-hq/assurance"

[tool.setuptools.packages.find]
include = ["assurance_budget*"]

[tool.setuptools.package-data]
assurance_budget = ["py.typed", "data/*.jsonl"]

[tool.mypy]
strict = true
# The siblings are installed editable, and a PEP 660 editable install is invisible to mypy, so
# their sources are named here. Without it, `mypy --strict` reports every sibling import as
# missing and then a cascade of Any-returns behind it, which is why nobody could run this.
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core"
