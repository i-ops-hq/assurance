name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install assurance-core (sibling checkout when present)
        run: |
          python -m pip install --upgrade pip
          if [ -d ../assurance-core ]; then
            python -m pip install -e ../assurance-core
          fi
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: The baseline file is the only thing this tool may write
        # The gate runs with the suite above. It runs again, named, because "read-only except
        # one file you asked for" is the promise people point this at a finance folder on.
        run: python -m pytest -q tests/ -k "write or read_only or baseline" --no-header

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
