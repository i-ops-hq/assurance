name: tests

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to other code, and
# these workflows check this repository out and run it. The trailing comment is the release that
# commit is, so moving one is a deliberate edit rather than something that happens to us.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # One repo, so the cross-package dependency is a directory rather than a network resolve.
      # This is why the three packages were merged: until 2026-09-03 they were separate repos and
      # this step was a checkout of a sibling that had to exist. When it did not, every job silently
      # resolved assurance-core from PyPI, and a release raising the CLI's floor in the same batch
      # that shipped that core version failed on itself — the badge read "tests failing" for an hour
      # on 2026-09-02 with nothing wrong in the code. `released-against-itself` cannot happen here.
      - name: Install every package from this tree, in dependency order
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core
          python -m pip install -e "packages/cli[dev]"
          python -m pip install -e "packages/mcp[dev]"
          python -m pip install -e packages/budget
          python -m pip install -e packages/authority
          python -m pip install -e packages/deps
          python -m pip install -e packages/assurance

      - name: Tests
        run: python -m pytest -q packages/core/tests packages/cli/tests packages/mcp/tests packages/budget/tests packages/authority/tests packages/deps/tests packages/assurance/tests

      - name: The baseline file is the only thing the CLI may write
        # Runs with the suite above. It runs again, named, because "read-only except one file you
        # asked for" is the promise people point this at a finance folder on.
        run: python -m pytest -q packages/cli/tests -k "write or read_only or baseline" --no-header

  # Every package sets `strict = true` under `[tool.mypy]`, and until now nothing ran it. Two
  # helpers in assurance-deps shipped without the annotations it asks for, and the only thing that
  # ever said so was a pre-commit hook in a private repository, which says out loud that it can be
  # bypassed. A standard a package declares and nothing runs is a comment.
  #
  # 3.12, one job: `assurance_deps` imports tomllib behind a `try`, and on 3.10 mypy reports it
  # missing — true of that interpreter, not of the code.
  types:
    name: the strictness every package declares, run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The same install as the test job. A PEP 660 editable install is invisible to mypy, so each
      # package's `mypy_path` names its siblings' sources instead; the third party they read through
      # (openpyxl) still has to be installed, or every call into it reads as untyped.
      - name: Install every package from this tree, in dependency order
        run: |
          python -m pip install --upgrade pip mypy
          python -m pip install -e packages/core
          python -m pip install -e "packages/cli[dev]"
          python -m pip install -e "packages/mcp[dev]"
          python -m pip install -e packages/budget
          python -m pip install -e packages/authority
          python -m pip install -e "packages/deps[dev]"

      # From inside each package, which is where its configuration applies and the command
      # CONTRIBUTING gives. From the repository root mypy reads no config at all and answers with
      # dozens of errors that mean nothing.
      - name: mypy --strict, every package, under its own config
        run: |
          failed=""
          for pkg in core cli mcp budget authority deps; do
            echo "::group::assurance_$pkg"
            (cd "packages/$pkg" && python -m mypy --strict "assurance_$pkg") || failed="$failed assurance_$pkg"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=mypy::--strict failed for:$failed"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, cli, mcp, budget, authority, deps, assurance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/${{ matrix.package }}
          python -m twine check packages/${{ matrix.package }}/dist/*

  # The action pins the CLI version written beside it, so a commit that bumps that version points
  # the action at a release that does not exist yet. Testing it anyway fails at `pip install`, which
  # reads as a broken action. Testing it against the working tree instead would prove it works with
  # code nobody can install. So the job waits, says why, and runs once the release is on PyPI —
  # re-run this workflow on `main` after publishing, and it runs for real.
  action-ready:
    name: is the CLI this action pins on PyPI yet
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.published.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Look for the pinned version on PyPI
        id: published
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/cli/pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::no version in packages/cli/pyproject.toml"; exit 1
          fi
          if curl -sf "https://pypi.org/pypi/assurance-cli/$VERSION/json" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "assurance-cli $VERSION is on PyPI"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=coverage action::assurance-cli $VERSION is not on PyPI yet, so the action cannot be run the way a caller would run it. The job below is skipped, not passed; it runs once the release is published."
          fi

  action:
    name: the coverage action gates the way it says
    needs: action-ready
    if: needs.action-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Run against the PUBLISHED assurance-cli, the way a caller's workflow will. A job that tests
    # the action against the working tree proves the action works with code nobody can install yet.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fixtures — a complete series, one with a gap, and something that is not a series
        run: |
          mkdir -p fx/complete fx/gap fx/not-a-series
          for m in 01 02 03 04; do printf 'date,n\n2026-%s-05,1\n' $m > fx/complete/2026-$m.csv; done
          for m in 01 02 04; do printf 'date,n\n2026-%s-05,1\n' $m > fx/gap/2026-$m.csv; done
          for d in 2025-01-08 2025-01-09 2025-01-23 2025-02-02 2025-03-14; do
            printf 'a,b\n1,2\n' > "fx/not-a-series/incident-$d.csv"
          done

      - name: A complete series passes
        id: complete
        uses: ./actions/coverage
        with:
          folder: fx/complete

      - name: ...and says so in its outputs
        run: |
          [ "${{ steps.complete.outputs.complete }}" = "true" ] || { echo "::error::complete series did not report complete"; exit 1; }
          [ "${{ steps.complete.outputs.required }}" = "4" ] || { echo "::error::expected 4 required"; exit 1; }
          [ "${{ steps.complete.outputs.read }}" = "4" ] || { echo "::error::expected 4 read"; exit 1; }

      # `continue-on-error` and not `|| true`: a composite action's failure has to be observed as a
      # step outcome, and a shell that swallows it would let a silently-passing gate through here.
      - name: A gap fails
        id: gap
        uses: ./actions/coverage
        continue-on-error: true
        with:
          folder: fx/gap

      - name: ...and names the month
        run: |
          [ "${{ steps.gap.outcome }}" = "failure" ] || { echo "::error::a gap did not fail the gate"; exit 1; }
          case "${{ steps.gap.outputs.missing }}" in
            *March*) ;;
            *) echo "::error::the missing month was not named, got '${{ steps.gap.outputs.missing }}'"; exit 1 ;;
          esac

      # The case the whole action exists for. A gate that passes when nothing was checked looks
      # exactly like one that checked everything, and only one of them means anything.
      - name: Nothing to check fails by default
        id: nothing
        uses: ./actions/coverage
        continue-on-error: true
        with:
          folder: fx/not-a-series

      - name: ...with required at zero, which is the tell
        run: |
          [ "${{ steps.nothing.outcome }}" = "failure" ] || { echo "::error::a folder with no series passed the gate"; exit 1; }
          [ "${{ steps.nothing.outputs.required }}" = "0" ] || { echo "::error::expected required=0"; exit 1; }

      - name: ...and passes only when the caller says so out loud
        id: allowed
        uses: ./actions/coverage
        with:
          folder: fx/not-a-series
          allow-no-series: "true"

      - name: ...still reporting that it verified nothing
        run: |
          [ "${{ steps.allowed.outputs.required }}" = "0" ] || { echo "::error::allow-no-series should not invent a denominator"; exit 1; }
