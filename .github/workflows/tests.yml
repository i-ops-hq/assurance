name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One repo, so the cross-package dependency is a directory rather than a network resolve.
      # This is why the three packages were merged: until 2026-09-03 they were separate repos and
      # this step was a checkout of a sibling that had to exist. When it did not, every job silently
      # resolved assurance-core from PyPI, and a release raising the CLI's floor in the same batch
      # that shipped that core version failed on itself — the badge read "tests failing" for an hour
      # on 2026-09-02 with nothing wrong in the code. `released-against-itself` cannot happen here.
      - name: Install every package from this tree, in dependency order
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core
          python -m pip install -e "packages/cli[dev]"
          python -m pip install -e "packages/mcp[dev]"
          python -m pip install -e "packages/authority[dev]"

      - name: Tests
        run: python -m pytest -q packages/core/tests packages/cli/tests packages/mcp/tests packages/authority/tests

      - name: The baseline file is the only thing the CLI may write
        # Runs with the suite above. It runs again, named, because "read-only except one file you
        # asked for" is the promise people point this at a finance folder on.
        run: python -m pytest -q packages/cli/tests -k "write or read_only or baseline" --no-header

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, cli, mcp, authority]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/${{ matrix.package }}
          python -m twine check packages/${{ matrix.package }}/dist/*
