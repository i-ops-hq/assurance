name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: The server must still be read-only
        # The AST gate runs above with the suite. It runs again here, alone and named, because
        # this is the promise people install the package on: point it at a folder and it will
        # not write to it. A guarantee worth making is worth failing CI over by itself.
        run: python -m pytest -q tests/test_read_only.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distributions
        # twine check is what catches a README that renders as raw text on PyPI. It caught
        # nothing here only because the same defect was fixed by hand before publishing.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
