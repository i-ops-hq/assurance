name: publish

# Trusted Publishing (OIDC). No API token is stored anywhere — GitHub proves the
# workflow's identity to PyPI directly. Before the first run, register a publisher at
# https://pypi.org/manage/project/assurance-core/settings/publishing/
#   owner: i-ops-hq   repository: assurance-core
#   workflow: publish.yml   environment: pypi
#
# Then release by tagging: `git tag v0.1.1 && git push --tags`.
# The version in pyproject.toml is the source of truth; the tag only triggers.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Tests must pass before anything is published
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A dedicated environment so publishing rights are not implied by commit access.
    environment: pypi
    permissions:
      id-token: write          # required for OIDC; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
