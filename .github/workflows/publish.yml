name: publish

# Third-party actions are pinned to a commit, not a tag. This workflow holds the identity that
# publishes the package, so a tag retargeted to other code would publish whatever that code built,
# signed as us. The trailing comment is the release that commit is.

# Trusted Publishing (OIDC). No API token is stored anywhere — GitHub proves the workflow's identity
# to PyPI directly. Registered per project at https://pypi.org/manage/project/<name>/settings/publishing/
#   owner: i-ops-hq   repository: assurance   workflow: publish.yml   environment: pypi
#
# RELEASING: pyproject.toml is the version. The tag only triggers, and it names the package.
#   1. bump `version` in packages/<pkg>/pyproject.toml   2. add the CHANGELOG heading
#   3. commit                                            4. git tag <pkg>-vX.Y.Z && git push origin <pkg>-vX.Y.Z
#   A GitHub Release with that CHANGELOG section follows on its own (release-notes.yml).
#
# Five packages share this repo, so a bare `v0.5.1` is ambiguous between them. The prefix is what
# this workflow keys on to know what to build, and what the changelog gate checks each heading
# against.
#
# Guards below, all of which exist because the failures actually happened:
#   - a tag that disagrees with pyproject.toml rebuilt the OLD version and died on a PyPI 400
#   - re-running a workflow for a version already on PyPI failed the same way, leaving failed
#     deployments recorded for packages that were live and fine

on:
  push:
    tags: ["core-v*", "cli-v*", "mcp-v*", "budget-v*", "authority-v*", "deps-v*", "assurance-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.target.outputs.pkg }}
      dist: ${{ steps.target.outputs.dist }}
      version: ${{ steps.version.outputs.version }}
      already-on-pypi: ${{ steps.published.outputs.already }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Which package does this tag release?
        id: target
        run: |
          PKG="${GITHUB_REF_NAME%%-v*}"
          case "$PKG" in
            core|cli|mcp|budget|authority|deps|assurance) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME names no package. Use core-vX.Y.Z, cli-vX.Y.Z, mcp-vX.Y.Z, budget-vX.Y.Z, authority-vX.Y.Z, deps-vX.Y.Z or assurance-vX.Y.Z."; exit 1 ;;
          esac
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          # packages/assurance is the front-door distribution, published under the bare name.
          if [ "$PKG" = "assurance" ]; then DIST=assurance; else DIST="assurance-$PKG"; fi
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
          echo "releasing assurance-$PKG from packages/$PKG"

      - name: The tag must agree with that package's pyproject.toml
        id: version
        run: |
          PKG="${{ steps.target.outputs.pkg }}"
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('packages/$PKG/pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#*-v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME would publish $VERSION, not $TAG. The tag only triggers; pyproject.toml is the version. Bump the file, commit, delete the tag, then retag."
              exit 1
            fi
          fi

      - name: Is this version already on PyPI?
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${{ steps.target.outputs.dist }}/${{ steps.version.outputs.version }}/json")
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.target.outputs.dist }} ${{ steps.version.outputs.version }} is already on PyPI. Building and testing anyway; the upload will be skipped rather than failed."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/${{ steps.target.outputs.pkg }}
          python -m twine check packages/${{ steps.target.outputs.pkg }}/dist/*

      # One repo, so the cross-package dependency is a directory. This step used to be a checkout of
      # a sibling repository that had to exist; when it did not, the job resolved assurance-core
      # from PyPI and a release raising the floor in the same batch that shipped that core version
      # failed on itself. Installing from the tree makes `released-against-itself` impossible.
      - name: Tests must pass before anything is published
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core
          python -m pip install -e "packages/cli[dev]"
          python -m pip install -e "packages/mcp[dev]"
          python -m pip install -e packages/budget
          python -m pip install -e packages/authority
          python -m pip install -e packages/deps
          python -m pip install -e packages/assurance
          python -m pytest -q packages/core/tests packages/cli/tests packages/mcp/tests packages/budget/tests packages/authority/tests packages/deps/tests packages/assurance/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: packages/${{ steps.target.outputs.pkg }}/dist/

  publish:
    needs: build
    # A version already on PyPI is not a failure, it is a no-op. Skipping keeps the deployment
    # record honest: the environment shows releases that happened, and nothing else.
    if: needs.build.outputs.already-on-pypi != 'true'
    runs-on: ubuntu-latest
    # A dedicated environment so publishing rights are not implied by commit access.
    environment: pypi
    permissions:
      id-token: write          # required for OIDC; nothing else is granted
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Belt and braces against a race between the check above and the upload.
          skip-existing: true

  # Listing on the MCP registry, by the same principle as the PyPI job above: **no credential is
  # stored anywhere.** `mcp-publisher login github-oidc` proves this workflow's identity to the
  # registry, and the registry checks that identity owns the `io.github.i-ops-hq` namespace the
  # manifest claims. An interactive `login github` would work from a laptop and would mean a person
  # holding a token; this way nobody does.
  #
  # Runs after PyPI on purpose. The manifest points at a pypi package/version, so listing a version
  # the index does not serve yet would advertise something nobody can install.
  registry:
    needs: [build, publish]
    if: needs.build.outputs.pkg == 'mcp' && needs.build.outputs.already-on-pypi != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC only; no repo write, no secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: server.json must agree with the release
        # The manifest is a mirror of pyproject, and on 2026-09-02 it was found a patch behind —
        # 0.4.0 against a shipped 0.4.1. Listing a stale version is worse than not listing, because
        # it is wrong in public and nothing upstream would have caught it.
        run: |
          cd packages/mcp
          MANIFEST=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          PACKAGE=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          if [ "$MANIFEST" != "${{ needs.build.outputs.version }}" ] || [ "$PACKAGE" != "${{ needs.build.outputs.version }}" ]; then
            echo "server.json says $MANIFEST / package $PACKAGE, release is ${{ needs.build.outputs.version }}"
            exit 1
          fi

      - name: Wait for the version to be installable
        # PyPI's index, JSON API, resolver and CDN do not agree instantly.
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/assurance-mcp/${{ needs.build.outputs.version }}/json" > /dev/null; then
              echo "assurance-mcp ${{ needs.build.outputs.version }} is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for PyPI"; exit 1

      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          mv mcp-publisher packages/mcp/
          cd packages/mcp && ./mcp-publisher validate

      - name: Publish to the MCP registry
        run: |
          cd packages/mcp
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
