name: publish

# Trusted Publishing (OIDC). No API token is stored anywhere — GitHub proves the workflow's identity
# to PyPI directly. The publisher is registered per project at
# https://pypi.org/manage/project/assurance-mcp/settings/publishing/
#   owner: i-ops-hq   repository: assurance-mcp   workflow: publish.yml   environment: pypi
#
# RELEASING: pyproject.toml is the version. The tag only triggers.
#   1. bump `version` in pyproject.toml   2. commit   3. `git tag vX.Y.Z && git push --tags`
#
# Two guards below, both of which exist because both failures actually happened on 2026-08-29:
#   - a tag that disagrees with pyproject.toml rebuilt the OLD version and died on a PyPI 400
#     ninety seconds later, with a red X on a release that never happened
#   - re-running a workflow for a version already on PyPI failed the same way, so every repo
#     carried failed deployments for packages that were live and fine

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already-on-pypi: ${{ steps.published.outputs.already }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must agree with pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml declares $VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME would publish $VERSION, not $TAG. The tag only triggers; pyproject.toml is the version. Bump the file, commit, delete the tag, then retag."
              exit 1
            fi
          fi

      - name: Is this version already on PyPI?
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/assurance-mcp/${{ steps.version.outputs.version }}/json")
          if [ "$CODE" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::assurance-mcp ${{ steps.version.outputs.version }} is already on PyPI. Building and testing anyway; the upload will be skipped rather than failed."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Tests must pass before anything is published
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A version already on PyPI is not a failure, it is a no-op. Skipping keeps the deployment
    # record honest: the environment shows releases that happened, and nothing else.
    if: needs.build.outputs.already-on-pypi != 'true'
    runs-on: ubuntu-latest
    # A dedicated environment so publishing rights are not implied by commit access.
    environment: pypi
    permissions:
      id-token: write          # required for OIDC; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Belt and braces against a race between the check above and the upload.
          skip-existing: true

  # Listing on the MCP registry, by the same principle as the PyPI job above: **no credential is
  # stored anywhere.** `mcp-publisher login github-oidc` proves this workflow's identity to the
  # registry, and the registry checks that identity owns the `io.github.i-ops-hq` namespace the
  # manifest claims. An interactive `login github` would work from a laptop and would mean a person
  # holding a token; this way nobody does.
  #
  # Runs after PyPI on purpose. The manifest points at a pypi package/version, so listing a version
  # the index does not serve yet would advertise something nobody can install — the same
  # release-against-itself race that took assurance-cli's CI red on 2026-09-02, pointed outward.
  registry:
    needs: [build, publish]
    if: needs.build.outputs.already-on-pypi != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC only; no repo write, no secrets
    steps:
      - uses: actions/checkout@v4

      - name: server.json must agree with the release
        # The manifest is a mirror of pyproject, and on 2026-09-02 it was found a patch behind —
        # 0.4.0 against a shipped 0.4.1. Listing a stale version is worse than not listing, because
        # it is wrong in public and nothing upstream would have caught it.
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          PACKAGE=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          if [ "$MANIFEST" != "${{ needs.build.outputs.version }}" ] || [ "$PACKAGE" != "${{ needs.build.outputs.version }}" ]; then
            echo "server.json says $MANIFEST / package $PACKAGE, release is ${{ needs.build.outputs.version }}"
            exit 1
          fi

      - name: Wait for the version to be installable
        # PyPI's index, JSON API, resolver and CDN do not agree instantly.
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/assurance-mcp/${{ needs.build.outputs.version }}/json" > /dev/null; then
              echo "assurance-mcp ${{ needs.build.outputs.version }} is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for PyPI"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
